<style>
/* Layout: mesa de conferência. O dia em forma de extrato no topo, o mês logo abaixo, detalhes por cliente e equipe no fim. */
:root{
  --bg:#EEF2EF;--surface:#FBFCFB;--sunken:#E2E8E4;--line:#CDD6D0;
  --fg:#14211A;--muted:#55665C;--accent:#24553A;--accent-ink:#FFFFFF;--accent-soft:#DCE9E1;

  --display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --body:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C1410;--surface:#15211A;--sunken:#090F0C;--line:#2B3B32;
  --fg:#E7EFEA;--muted:#9DB0A5;--accent:#66C08F;--accent-ink:#062012;--accent-soft:#193A29;
  --pos:#66C08F;--neg:#F0857A;--neg-soft:#40201D;--warn:#E9C466;--warn-soft:#3A2F12;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1410;--surface:#15211A;--sunken:#090F0C;--line:#2B3B32;
  --fg:#E7EFEA;--muted:#9DB0A5;--accent:#66C08F;--accent-ink:#062012;--accent-soft:#193A29;

*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}
.login{max-width:380px;width:100%;margin:6vh auto 0;display:grid;gap:12px}
.conta{max-width:420px}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--body);font-variant-numeric:tabular-nums}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 56px;display:grid;gap:20px}
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;justify-content:space-between}

h2.cap::first-letter{text-transform:uppercase}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.muted{color:var(--muted)} .small{font-size:13px}
.note{padding:10px 13px;border-radius:6px;font-size:14px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:space-between}
.note.warn{background:var(--warn-soft);color:var(--warn)} .note.bad{background:var(--neg-soft);color:var(--neg)} .note.ok{background:var(--accent-soft);color:var(--fg)}
.drop{border:1.5px dashed var(--line);border-radius:8px;padding:14px 16px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;background:transparent}

table{border-collapse:collapse;width:100%;font-size:14px}

tbody tr:last-child td{border-bottom:0}
tr.sel td{background:var(--accent-soft)}
details summary{cursor:pointer;color:var(--muted);font-size:13px}
.form{display:grid;gap:10px}
.f{display:grid;gap:3px;min-width:0}
.f label,.flabel{font-size:12px;font-weight:600;color:var(--muted)}
.f input,.f select{padding:7px 9px;border:1px solid var(--line);border-radius:5px;background:var(--bg);width:100%;min-width:0}
.line{display:grid;grid-template-columns:minmax(0,1fr) 130px auto;gap:8px;align-items:end}
.person{border:1px solid var(--line);border-radius:6px;padding:12px;display:grid;gap:10px}
.person .cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) minmax(0,.7fr) minmax(0,1.2fr) auto;gap:8px;align-items:end}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:4px 12px;font-size:14px;margin-top:8px}
.checks label{display:flex;gap:6px;align-items:center;min-width:0;overflow-wrap:anywhere}
.savebar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 15px;border-radius:6px;font-size:14px;z-index:5;max-width:90vw}
.stack{display:grid;gap:20px}
.calc-sel{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.calc-pix{font:700 clamp(32px,6vw,46px)/1.1 var(--display);margin:4px 0 12px;overflow-wrap:anywhere}
.cli-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.filtros{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.filtros .f{flex:1 1 130px;max-width:190px}
.resumo{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.resumo b{display:block;font:700 20px/1.25 var(--display);overflow-wrap:anywhere}
tr.cancelada td{color:var(--muted);text-decoration:line-through}
tr.cancelada td.nota{text-decoration:none}
.taxas-t input{width:76px;padding:4px 6px;border:1px solid var(--line);border-radius:4px;background:var(--bg);text-align:right}
.taxas-t td{padding:4px 8px}
@media (max-width:760px){
  .day,.grid2{grid-template-columns:minmax(0,1fr)}
  .person .cols{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .line{grid-template-columns:minmax(0,1fr) 110px auto}
}
@media (prefers-reduced-motion:no-preference){.rank .bar i{transition:width .2s}}
</style>

<body>
<div class="wrap">
  <header class="top">
    <div class="marca"><img src="img/logo.png" alt="" width="44" height="44"><h1>Invest Cred</h1></div>
    <nav aria-label="Seções" id="nav" hidden>
      <button data-go="calculadora">Calculadora</button>
      <button data-go="vendas">Vendas</button>
      <button data-go="planilhas" data-papel="gerente">Planilhas</button>
      <button data-go="painel" data-papel="dono">Painel</button>
      <button data-go="taxas" data-papel="dono">Taxas</button>
      <button data-go="custos" data-papel="dono">Custos e equipe</button>

      <button data-go="conta">Conta</button>
    </nav>
  </header>

  <main id="app" class="stack"><p class="muted">Carregando seus dados…</p></main>

<script src="vendor/xlsx.full.min.js"></script>
<script src="vendor/supabase.js"></script>
<script>
/* ---------- utilitários ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cents=n=>Math.round((Number(n)||0)*100)/100;
const fmtBRL=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
const brl=n=>fmtBRL.format(cents(n));
const brl0=n=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0}).format(n);
const norm=s=>String(s??'').trim().replace(/\s+/g,' ').toUpperCase();
const uid=()=>Math.random().toString(36).slice(2,10);
const clone=o=>JSON.parse(JSON.stringify(o));
const pad=n=>String(n).padStart(2,'0');
const toD=iso=>{const[y,m,d]=iso.split('-').map(Number);return new Date(y,m-1,d)};
const fmtDia=iso=>iso.split('-').reverse().join('/');
const fmtDiaLongo=iso=>toD(iso).toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric'});
const fmtMes=m=>{const[y,mo]=m.split('-').map(Number);return new Date(y,mo-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'})};
const mesAtual=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)};

const hojeISO=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const fmtPct=n=>(+n||0).toLocaleString('pt-BR',{maximumFractionDigits:3})+'%';
const soDigitos=s=>String(s??'').replace(/\D/g,'');
const fmtCpf=c=>c.replace(/^(\d{3})(\d{3})(\d{3})(\d{2})$/,'$1.$2.$3-$4');
const fmtTel=t=>t.replace(/^(\d{2})(\d{4,5})(\d{4})$/,'($1) $2-$3');
function cpfValido(c){
  if(!/^\d{11}$/.test(c)||/^(\d)\1{10}$/.test(c))return false;
  for(const n of[9,10]){let t=0;for(let i=0;i<n;i++)t+=+c[i]*(n+1-i);let d=t*10%11;if(d===10)d=0;if(d!==+c[n])return false}
  return true;
}
const BANDEIRAS={visa:'Visa',master:'Master',elo:'Elo/Banese/demais'},MAQUINAS={pagbank:'PagBank',cielo:'Cielo'};
const VIEWS={gerente:['calculadora','vendas','planilhas','conta'],dono:['calculadora','vendas','painel','taxas','custos','historico','conta']};
const calcInicial=()=>({maquina:'pagbank',bandeira:'visa',parcelas:1,modo:'cartao',valor:'',nome:'',cpf:'',telefone:'',data:hojeISO()});
const vfInicial=()=>({de:mesAtual()+'-01',ate:hojeISO(),maquina:'',bandeira:''});

/* ---------- leitura da planilha ---------- */
function parseMoney(v){
  if(typeof v==='number')return isFinite(v)?v:null;
  if(v==null)return null;
  let s=String(v).trim();if(!s)return null;
  const neg=/^\(.*\)$/.test(s)||/-/.test(s);
  s=s.replace(/[^\d.,]/g,'');if(!/\d/.test(s))return null;
  const c=s.lastIndexOf(','),p=s.lastIndexOf('.');
  if(c>-1&&p>-1)s=c>p?s.replace(/\./g,'').replace(',','.'):s.replace(/,/g,'');
  else if(c>-1)s=s.replace(/\./g,'').replace(',','.');
  else if(p>-1&&/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');
  const n=parseFloat(s);if(!isFinite(n))return null;
  return neg?-n:n;
}
function validISO(y,m,d){
  if(m<1||m>12||d<1)return null;
  const dt=new Date(Date.UTC(y,m-1,d));
  if(dt.getUTCMonth()!==m-1||dt.getUTCDate()!==d)return null;
  return y+'-'+pad(m)+'-'+pad(d);
}
function parseDate(c,date1904){
  if(typeof c==='number'){
    if(c<36526||c>73050)return null; /* só 2000 a 2099 */
    const n=Math.floor(c)+(date1904?1462:0);
    return new Date(Date.UTC(1899,11,30)+n*864e5).toISOString().slice(0,10);
  }
  if(typeof c!=='string')return null;
  const s=c.trim();let m;
  if((m=s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4}|\d{2})$/))){
    const y=+m[3]<100?2000+ +m[3]:+m[3];return validISO(y,+m[2],+m[1]);
  }
  if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/)))return validISO(+m[1],+m[2],+m[3]);
  return null;
}
/* Procura a linha com "CLIENTE"; cada coluna com data no cabeçalho vira um dia. */
function parseWorkbook(buf,nome){
  const isText=/\.(csv|tsv|txt)$/i.test(nome);
  const wb=XLSX.read(buf,{type:'array',raw:isText});
  const date1904=!!wb.Workbook?.WBProps?.date1904;
  const dias=new Map();const avisos=[];let ignoradas=0,achouTabela=false;
  for(const sn of wb.SheetNames){
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:null});
    let hi=-1,ci=-1;
    for(let i=0;i<Math.min(rows.length,40)&&hi<0;i++){
      const k=(rows[i]||[]).findIndex(c=>typeof c==='string'&&norm(c).startsWith('CLIENTE'));
      if(k>-1){hi=i;ci=k}
    }
    if(hi<0)continue;
    const cols=[];(rows[hi]||[]).forEach((c,j)=>{if(j!==ci){const d=parseDate(c,date1904);if(d)cols.push({j,d})}});
    if(!cols.length)continue;
    achouTabela=true;
    for(const{j,d}of cols){
      const mapa=new Map();let arq=null;
      for(let i=hi+1;i<rows.length;i++){
        const r=rows[i]||[];const n=norm(r[ci]);if(!n)continue;
        if(n.startsWith('TOTAL')){arq=parseMoney(r[j]);break}
        const v=parseMoney(r[j]);
        if(mapa.has(n)){avisos.push(`Parceiro repetido em ${fmtDia(d)}: ${n}. Os valores foram somados.`);mapa.get(n).valor=cents(mapa.get(n).valor+(v||0))}
        else mapa.set(n,{cliente:String(r[ci]).trim().replace(/\s+/g,' '),valor:cents(v||0)});
      }
      const linhas=[...mapa.values()];
      if(!linhas.some(l=>l.valor!==0)){ignoradas++;continue}
      const total=cents(linhas.reduce((a,l)=>a+l.valor,0));
      if(arq!=null&&Math.abs(arq-total)>0.009)avisos.push(`Em ${fmtDia(d)} a soma dos parceiros dá ${brl(total)}, mas a linha TOTAL da planilha mostra ${brl(arq)}. A dash usa a soma dos parceiros.`);
      if(dias.has(d))avisos.push(`A data ${fmtDia(d)} aparece mais de uma vez. Ficou a última coluna lida.`);
      dias.set(d,{data:d,linhas,total,arquivo:nome,totalArquivo:arq});
    }
  }
  if(!achouTabela)throw new Error('Não encontrei a tabela. A planilha precisa de uma linha com "CLIENTE" e, ao lado, uma coluna com a data do dia, como 09/10/2026.');
  return{dias:[...dias.values()].sort((a,b)=>a.data<b.data?-1:1),avisos,ignoradas};
}

/* ---------- cálculo ---------- */
const CFG0={fixos:[],funcionarias:[],dias:26};
function cfgDoMes(mes){
  const ks=Object.keys(S.custos).sort();if(!ks.length)return CFG0;
  let k=null;for(const x of ks)if(x<=mes)k=x;
  return S.custos[k||ks[0]];
}
const somaFixos=c=>c.fixos.reduce((a,f)=>a+(+f.valor||0),0);
const somaSal=c=>c.funcionarias.reduce((a,f)=>a+(+f.salario||0),0);
const custoMes=c=>somaFixos(c)+somaSal(c);
const custoDia=c=>custoMes(c)/Math.max(1,+c.dias||1);
function comissaoDe(f,dia){
  let base=dia.total;
  if(f.base==='carteira'){const s=new Set((f.clientes||[]).map(norm));base=dia.linhas.filter(l=>s.has(norm(l.cliente))).reduce((a,l)=>a+l.valor,0)}
  return cents(base*(+f.pct||0)/100);
}
function calcDia(dia){
  const c=cfgDoMes(dia.data.slice(0,7));
  const por=c.funcionarias.map(f=>({id:f.id,valor:comissaoDe(f,dia)}));
  const comissoes=cents(por.reduce((a,p)=>a+p.valor,0));
  const custo=cents(custoDia(c));
  return{receita:dia.total,comissoes,custo,lucro:cents(dia.total-comissoes-custo),por};
}
function diasDoMes(mes){return Object.values(S.dias).filter(d=>d.data.startsWith(mes)).sort((a,b)=>a.data<b.data?-1:1)}
function calcMes(mes){
  const ds=diasDoMes(mes),c=cfgDoMes(mes);
  const t={receita:0,comissoes:0,custo:0,lucro:0,n:ds.length,porFunc:{}};
  for(const d of ds){const r=calcDia(d);t.receita+=r.receita;t.comissoes+=r.comissoes;t.custo+=r.custo;t.lucro+=r.lucro;r.por.forEach(p=>t.porFunc[p.id]=(t.porFunc[p.id]||0)+p.valor)}
  t.custoMes=custoMes(c);t.cobertura=cents(t.receita-t.comissoes-t.custoMes);t.cfg=c;
  return t;
}
function addDias(iso,n){const d=toD(iso);d.setDate(d.getDate()+n);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}

function contaVenda(valor,pct,custoPct){
  const c=Math.round(valor*100),taxa=Math.round(c*Math.round(pct*1000)/100000);
  const custo=custoPct==null?null:Math.round(c*Math.round(custoPct*1000)/100000);
  return{cartao:c/100,taxa:taxa/100,pix:(c-taxa)/100,custo:custo==null?null:custo/100,lucro:custo==null?null:(taxa-custo)/100};
}
function calcAtual(){
  const k=S.calc,pct=S.cobranca[k.bandeira+'|'+k.parcelas],base=parseMoney(k.valor)||0;
  if(pct==null||base<=0)return{pct};
  const cartao=k.modo==='pix'?cents(base/(1-pct/100)):base;
  const bc=S.custoTaxas[k.maquina+'|'+k.bandeira+'|'+k.parcelas];
  const custoPct=S.papel==='dono'&&bc!=null?bc+(S.adicionais[k.maquina]||0):null;
  return{pct,custoPct,...contaVenda(cartao,pct,custoPct)};
}

async function registraVenda(btn){
  const k=S.calc,r=calcAtual(),cpf=soDigitos(k.cpf),tel=soDigitos(k.telefone);
  const erro=r.cartao==null?'Informe o valor da venda.':!k.nome.trim()?'Informe o nome do cliente.':!cpfValido(cpf)?'CPF inválido. Confira os números.':![10,11].includes(tel.length)?'Telefone inválido. Informe o DDD e o número.':!k.data||k.data>hojeISO()?'Informe uma data de venda válida.':null;
  S.err=erro;if(erro){render();return}
  btn.disabled=true;
  const{data,error}=await sb.rpc('registrar_venda',{p_data:k.data,p_maquina:k.maquina,p_bandeira:k.bandeira,p_parcelas:+k.parcelas,p_valor_cartao:r.cartao,p_nome:k.nome.trim(),p_cpf:cpf,p_telefone:tel});
  if(error){S.err=error.code==='P0001'||error.code==='42501'?error.message:'Não foi possível registrar. Verifique a conexão e tente de novo.';render();return}
  Object.assign(S.calc,{valor:'',nome:'',cpf:'',telefone:''});
  try{await carregaVendas()}catch(e){}
  toast(`Venda registrada: ${brl(data.valor_pix)} no Pix.`);render();
}

async function salvaTaxas(){
  const d=S.taxasDraft,ok=n=>typeof n==='number'&&n>=0&&n<100;
  if(![...Object.values(d.cobranca),...Object.values(d.custo),d.adicional].every(ok)){S.err='Preencha todas as taxas com valores entre 0 e 99,99.';render();return}
  const cob=Object.entries(d.cobranca).map(([k,pct])=>{const[bandeira,p]=k.split('|');return{bandeira,parcelas:+p,pct}});
  const cus=Object.entries(d.custo).map(([k,pct])=>{const[maquina,bandeira,p]=k.split('|');return{maquina,bandeira,parcelas:+p,pct}});
  const rs=await Promise.all([sb.from('taxas_cobranca').upsert(cob),sb.from('taxas_custo').upsert(cus),sb.from('maquinas').upsert({id:'cielo',adicional:d.adicional})]);
  const e=rs.find(r=>r.error);
  if(e){S.err=errMsg(e.error);render();return}
  try{await carregaTaxas()}catch(x){}
  S.err=null;S.taxasDraft=null;toast('Taxas salvas.');render();
}
function contaHTML(){
  return `<section class="panel conta form"><h2>Conta</h2>
    <p class="muted" style="margin:0">E-mail da conta: ${esc(S.sessao.user.email)}</p>

      <div class="f"><label for="nova-senha">Nova senha</label><input id="nova-senha" type="password" autocomplete="new-password" minlength="8" required></div>
      <div class="f"><label for="nova-senha2">Repita a nova senha</label><input id="nova-senha2" type="password" autocomplete="new-password" minlength="8" required></div>
      <div class="note" id="senha-msg" hidden></div>
      <button class="btn primary" type="submit">Trocar senha</button>
    </form>
    <button class="btn" data-act="sair">Sair da conta</button></section>`;
}
function render(){
  const gerente=S.papel==='gerente';
  if(S.papel&&!VIEWS[S.papel].includes(S.view))S.view=VIEWS[S.papel][0];
  document.querySelectorAll('#nav button').forEach(b=>{b.setAttribute('aria-current',b.dataset.go===S.view);b.hidden=!!b.dataset.papel&&b.dataset.papel!==(gerente?'gerente':'dono')});
  $('#nav').hidden=S.acesso!=='ok';
  const app=$('#app');
  if(!S.authPronto){app.innerHTML='<p class="muted">Carregando…</p>';return}
  if(!S.sessao){app.innerHTML=sb?loginHTML():'';return}
  if(S.acesso==='negado'){app.innerHTML=negadoHTML();return}
  if(S.acesso!=='ok'){app.innerHTML='';return}
  app.innerHTML=S.view==='conta'?contaHTML():S.view==='planilhas'?planilhasHTML():S.view==='calculadora'?calcHTML():S.view==='vendas'?vendasHTML():S.view==='taxas'?taxasHTML():S.view==='custos'?custosHTML():S.view==='historico'?historicoHTML():painelHTML();
  if(S.view==='custos')resumoCustos();
  drawChart();
}

/* ---------- gráfico ---------- */
function niceStep(x){const p=Math.pow(10,Math.floor(Math.log10(x)));const f=x/p;return Math.max(1,(f<=1?1:f<=2?2:f<=5?5:10)*p)}
function drawChart(){
  const box=$('#chart');if(!box)return;
  const{de,ate}=box.dataset,w=Math.max(280,box.clientWidth),h=230,L=66,R=8,T=20,B=26;
  const ds=diasEntre(de,ate).map(d=>({data:d.data,...calcDia(d)}));
  if(!ds.length){box.innerHTML='<p class="muted" style="margin:0">Nenhuma planilha importada nessas datas.</p>';box.dataset.w=box.clientWidth;return}
  const n=Math.round((toD(ate)-toD(de))/864e5)+1;
  const idx=iso=>Math.round((toD(iso)-toD(de))/864e5);
  const mesInteiro=limitesMes(de.slice(0,7)).de===de&&limitesMes(de.slice(0,7)).ate===ate;
  const vals=ds.map(d=>d.lucro);
  let lo=Math.min(0,...vals),hi=Math.max(0,...vals);if(lo===hi)hi=1;
  const st=niceStep((hi-lo)/4);lo=Math.floor(lo/st)*st;hi=Math.ceil(hi/st)*st;
  const y=v=>T+(hi-v)/(hi-lo)*(h-T-B),band=(w-L-R)/n,x=i=>L+i*band;
  const bw=Math.max(2,Math.min(22,band*.62));
  let s=`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="Lucro por dia de ${fmtDia(de)} a ${fmtDia(ate)}">`;
  for(let v=lo;v<=hi+1e-6;v+=st){
    s+=`<line x1="${L}" x2="${w-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--${v===0?'muted':'line'})" stroke-width="1"/>`;
    s+=`<text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="12" fill="var(--muted)">${brl0(v)}</text>`;
  }
  const passo=Math.max(1,Math.ceil(n/(w<500?4:8)));
  for(let i=0;i<n;i++){
    const iso=addDias(de,i),dd=+iso.slice(8);
    if(mesInteiro?(dd===1||dd%5===0):i%passo===0)s+=`<text x="${x(i)+band/2}" y="${h-8}" text-anchor="middle" font-size="12" fill="var(--muted)">${mesInteiro?dd:fmtDia(iso).slice(0,5)}</text>`;
  }
  const destaca=S.periodo==='dia';
  ds.forEach(d=>{
    const i=idx(d.data),up=d.lucro>=0,y0=y(0),y1=y(d.lucro),bh=Math.max(2,Math.abs(y1-y0)),r=Math.min(4,bw/2,bh);
    const bx=x(i)+(band-bw)/2,sel=destaca&&d.data===S.date;
    const path=up?`M${bx} ${y0}V${y0-bh+r}Q${bx} ${y0-bh} ${bx+r} ${y0-bh}H${bx+bw-r}Q${bx+bw} ${y0-bh} ${bx+bw} ${y0-bh+r}V${y0}Z`
                 :`M${bx} ${y0}V${y0+bh-r}Q${bx} ${y0+bh} ${bx+r} ${y0+bh}H${bx+bw-r}Q${bx+bw} ${y0+bh} ${bx+bw} ${y0+bh-r}V${y0}Z`;
    s+=`<path d="${path}" fill="var(--${up?'pos':'neg'})" opacity="${sel||!destaca||ds.length===1?1:.55}"/>`;
    if(sel){
      const tx=Math.min(w-R,Math.max(L+24,x(i)+band/2));
      s+=`<text x="${tx}" y="${up?Math.max(13,y0-bh-6):Math.min(h-B-4,y0+bh+15)}" text-anchor="${tx>=w-R-30?'end':'middle'}" font-size="12" font-weight="600" fill="var(--fg)">${brl(d.lucro)}</text>`;
    }
    s+=`<rect data-chart-dia="${d.data}" x="${x(i)}" y="${T}" width="${band}" height="${h-T-B}" fill="transparent" style="cursor:pointer"/>`;
  });
  s+='</svg><div class="tip" id="tip" hidden></div>';
  box.innerHTML=s;box.dataset.w=box.clientWidth;
  const tip=$('#tip');
  box.querySelectorAll('[data-chart-dia]').forEach(r=>{
    r.addEventListener('mouseenter',()=>{
      const d=ds.find(z=>z.data===r.dataset.chartDia);
      tip.innerHTML=`${fmtDia(d.data)}: <b>${brl(d.lucro)}</b><br>Ganho das operações ${brl(d.receita)}`;
      tip.hidden=false;
      const cx=+r.getAttribute('x')+band/2;
      tip.style.left=Math.max(0,Math.min(box.clientWidth-tip.offsetWidth,cx-tip.offsetWidth/2))+'px';tip.style.top='0px';
    });
    r.addEventListener('mouseleave',()=>tip.hidden=true);
    r.addEventListener('click',()=>{S.date=r.dataset.chartDia;S.periodo='dia';render()});
  });
}
new ResizeObserver(()=>{const b=$('#chart');if(b&&+b.dataset.w!==b.clientWidth)drawChart()}).observe(document.body);

/* ---------- eventos ---------- */
function marcaSujo(){S.dirty=true;const s=$('#salvo');if(s)s.textContent='Alterações ainda não salvas.';resumoCustos()}
function ir(v){
  S.view=v;S.err=null;S.confirm=null;S.cancelando=null;S.taxasDraft=null;
  try{location.hash=v}catch(e){}
  render();window.scrollTo(0,0);
}
document.addEventListener('click',async e=>{
  const g=e.target.closest('[data-go]');if(g){ir(g.dataset.go);return}
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,to=b.dataset.to,d=S.draft;
  if(a==='sair'){await sb.auth.signOut({scope:'local'});S.view='calculadora';try{location.hash='calculadora'}catch(e){}return}
  if(a==='dia'&&to){S.date=to;if(S.periodo==='custom')S.periodo='dia';render()}
  if(a==='periodo'){S.periodo=to;render()}
  if(a==='cancelaPrev'){S.prev=null;render()}
  if(a==='salvaPrev')salvaPrev();
  if(a==='abre'){S.date=to;S.periodo='dia';ir('painel')}
  if(a==='confirma'){S.confirm=to;render()}
  if(a==='apaga'){
    try{await apaga('dias',to);S.confirm=null;if(S.date===to)S.date=null;toast(`Dia ${fmtDia(to)} excluído.`);render()}
    catch(err){S.err=errMsg(err);toast(S.err)}
  }
  if(a==='addFixo'){d.fixos.push({id:uid(),nome:'',valor:0});S.dirty=true;render();$(`#fx-n-${d.fixos.at(-1).id}`)?.focus()}
  if(a==='rmFixo'){d.fixos=d.fixos.filter(f=>f.id!==b.dataset.id);S.dirty=true;render()}
  if(a==='addFunc'){d.funcionarias.push({id:uid(),nome:'',salario:0,pct:0,base:'todos',clientes:[]});S.dirty=true;render();$(`#p-n-${d.funcionarias.at(-1).id}`)?.focus()}
  if(a==='rmFunc'){d.funcionarias=d.funcionarias.filter(f=>f.id!==b.dataset.id);S.dirty=true;render()}
  if(a==='salvaCustos')salvaCustos();
  if(a==='registraVenda')registraVenda(b);
  if(a==='abreCancel'){S.cancelando=to;render();$('#motivo')?.focus()}
  if(a==='fechaCancel'){S.cancelando=null;render()}
  if(a==='exportaVendas')exportaVendas();
  if(a==='salvaTaxas')salvaTaxas();
  if(a==='confirmaCancel'){
    const m=$('#motivo').value.trim();if(!m){toast('Informe o motivo do cancelamento.');return}
    const{error}=await sb.rpc('cancelar_venda',{p_id:to,p_motivo:m});
    if(error){toast(error.code==='P0001'||error.code==='42501'?error.message:'Não foi possível cancelar. Tente de novo.');return}
    S.cancelando=null;try{await carregaVendas()}catch(x){}toast('Venda cancelada.');render();
  }
});
document.addEventListener('submit',async e=>{
  e.preventDefault();
  if(e.target.id==='form-vendas'){
    let de=$('#v-de').value,ate=$('#v-ate').value;if(!de||!ate)return;
    if(de>ate)[de,ate]=[ate,de];
    Object.assign(S.vF,{de,ate});S.cancelando=null;
    try{await carregaVendas()}catch(x){toast('Não consegui buscar as vendas.')}
    render();return;
  }
  if(e.target.id==='form-periodo'){
    let de=$('#per-de').value,ate=$('#per-ate').value;
    if(!de||!ate)return;
    if(de<'2000-01-01'||ate>'2099-12-31'){toast('Escolha datas entre 2000 e 2099.');return}
    if(de>ate)[de,ate]=[ate,de];
    Object.assign(S,{periodo:'custom',de,ate});
    /* O dia escolhido passa a ser o último com planilha dentro da faixa, ou antes dela. */
    const lista=Object.keys(S.dias).sort();
    S.date=lista.filter(d=>d<=ate).pop()||lista[0];
    render();return;
  }
  if(e.target.id==='form-login'){
    const err=$('#login-erro'),btn=$('#login-btn');err.hidden=true;btn.disabled=true;btn.textContent='Entrando…';
    const{error}=await sb.auth.signInWithPassword({email:$('#login-email').value.trim(),password:$('#login-senha').value});
    if(error){
      err.textContent=error.status===400?'E-mail ou senha incorretos.':error.status===429?'Muitas tentativas. Aguarde alguns minutos e tente de novo.':'Não consegui entrar. Verifique a conexão e tente de novo.';
      err.hidden=false;btn.disabled=false;btn.textContent='Entrar';
    }
  }
  if(e.target.id==='form-senha'){
    const a=$('#nova-senha').value,b=$('#nova-senha2').value,m=$('#senha-msg');
    const mostra=(t,k)=>{m.textContent=t;m.className='note '+k;m.hidden=false};
    if(a!==b){mostra('As duas senhas não são iguais.','bad');return}
    const{error}=await sb.auth.updateUser({password:a});
    if(error)mostra(error.code==='same_password'?'A nova senha precisa ser diferente da atual.':error.code==='weak_password'?'Essa senha é fraca. Escolha uma mais longa.':'Não consegui trocar a senha. Tente de novo.','bad');
    else{e.target.reset();mostra('Senha trocada.','ok')}
  }
});
document.addEventListener('input',e=>{
  const t=e.target,d=S.draft;
  if(t.dataset.calc&&t.tagName==='INPUT'){S.calc[t.dataset.calc]=t.value;const r=$('#calc-res');if(r)r.innerHTML=calcResultadoHTML();return}
  if(t.dataset.tx){const x=S.taxasDraft,n=parseMoney(t.value);if(t.dataset.tx==='adicional')x.adicional=n;else x[t.dataset.tx][t.dataset.k]=n;return}
  if(t.dataset.fx){const f=d.fixos.find(x=>x.id===t.dataset.fx);f[t.dataset.k]=t.dataset.k==='valor'?(parseMoney(t.value)||0):t.value;marcaSujo()}
  else if(t.dataset.p&&t.tagName==='INPUT'){const f=d.funcionarias.find(x=>x.id===t.dataset.p);f[t.dataset.k]=t.dataset.k==='nome'?t.value:(parseMoney(t.value)||0);marcaSujo()}
  else if(t.id==='dias-func'){d.dias=parseInt(t.value,10)||0;marcaSujo()}
});
document.addEventListener('change',e=>{
  const t=e.target,d=S.draft;
  if(t.dataset.calc&&t.tagName==='SELECT'){
    S.calc[t.dataset.calc]=t.dataset.calc==='parcelas'?+t.value:t.value;
    if(t.dataset.calc==='modo')$('#c-val-l').textContent=t.value==='pix'?'Valor que o cliente quer receber':'Valor passado no cartão';
    $('#calc-res').innerHTML=calcResultadoHTML();return;
  }
  if(t.dataset.vf){S.vF[t.dataset.vf]=t.value;S.cancelando=null;render();return}
  if(t.id==='arquivo'){handleFile(t.files[0]);return}
  if(t.id==='sel-dia'){S.date=t.value;if(S.periodo==='custom')S.periodo='dia';render();return}
  if(t.id==='custos-mes'){
    if(S.dirty)toast('As alterações não salvas foram descartadas.');
    S.draftMes=t.value;S.draft=null;S.dirty=false;S.err=null;render();return;
  }
  if(t.dataset.p&&t.dataset.k==='base'){d.funcionarias.find(x=>x.id===t.dataset.p).base=t.value;S.dirty=true;render();return}
  if(t.dataset.cli){
    const f=d.funcionarias.find(x=>x.id===t.dataset.cli);const set=new Set(f.clientes||[]);
    if(t.checked)set.add(t.value);else [...set].forEach(c=>{if(norm(c)===norm(t.value))set.delete(c)});
    f.clientes=[...set];marcaSujo();
  }
});
async function salvaCustos(){
  const d=S.draft;S.err=null;
  if(!(d.dias>=1&&d.dias<=31)){S.err='Os dias de funcionamento precisam estar entre 1 e 31.';render();return}
  const fixos=d.fixos.filter(f=>f.nome.trim()||f.valor);
  const func=d.funcionarias.filter(f=>f.nome.trim()||f.salario||f.pct);
  if(fixos.some(f=>!f.nome.trim())){S.err='Dê um nome a todos os gastos com valor.';render();return}
  if(func.some(f=>!f.nome.trim())){S.err='Informe o nome de todas as funcionárias.';render();return}
  if(func.some(f=>f.pct<0||f.pct>100)){S.err='A comissão precisa estar entre 0% e 100%.';render();return}
  const doc={mes:d.mes,dias:d.dias,fixos,funcionarias:func,atualizadoEm:new Date().toISOString()};
  try{await grava('custos',d.mes,doc);S.dirty=false;S.draftMes=d.mes;S.draft=null;toast(`Valores de ${fmtMes(d.mes)} salvos.`);render()}
  catch(e){S.err=errMsg(e);render()}
}
['dragover','dragleave','drop'].forEach(tp=>document.addEventListener(tp,e=>{
  const z=$('#drop');if(!z)return;
  if(tp!=='dragleave')e.preventDefault();
  z.classList.toggle('over',tp==='dragover');
  if(tp==='drop'&&e.dataTransfer.files[0])handleFile(e.dataTransfer.files[0]);
}));
function rota(){const h=location.hash.slice(1);if(['painel','planilhas','calculadora','vendas','taxas','custos','historico','conta'].includes(h)&&h!==S.view){S.view=h;render()}}
addEventListener('hashchange',rota);
rota();render();inicia();
</script>
